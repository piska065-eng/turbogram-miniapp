<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboGram — Космическая игра</title>
    
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0f2e 0%, #1a1f3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            border: 2px solid #ffd966;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        #timer {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd966;
            border-radius: 30px;
            padding: 10px 20px;
            color: #ffd966;
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        #score {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff6b6b;
            border-radius: 30px;
            padding: 10px 20px;
            color: #ff6b6b;
            font-size: 18px;
            font-weight: 700;
        }

        #difficulty {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #4CAF50;
            border-radius: 30px;
            padding: 5px 15px;
            color: #4CAF50;
            font-size: 14px;
            font-weight: 600;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd966;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            z-index: 20;
            display: none;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        #message h2 {
            color: #ffd966;
            font-size: 28px;
            margin-bottom: 15px;
        }

        #message p {
            color: #fff;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        #message button {
            background: linear-gradient(135deg, #4a3f6e, #2a1f4e);
            border: 2px solid #ffd966;
            border-radius: 50px;
            padding: 15px 30px;
            color: #ffd966;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        #message button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        #controlHint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #b0b0ff;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="timer">0с</div>
            <div id="score">💥 0</div>
        </div>
        <div id="difficulty">🌌 УРОВЕНЬ 1</div>
        
        <div id="message">
            <h2>🚀 ИГРА</h2>
            <p id="messageText">Управляй ракетой пальцем, уворачивайся от астероидов.<br>Продержись 30 секунд для скидки!</p>
            <button id="startBtn">НАЧАТЬ ИГРУ</button>
        </div>
        
        <div id="controlHint">👆 двигай пальцем по экрану</div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Игровые переменные
        let gameRunning = false;
        let gameTime = 0;
        let score = 0;
        let animationId = null;
        let difficultyLevel = 1;
        
        // ============================================================
        // МАЛЕНЬКИЕ ЗВЕЗДЫ НА ФОНЕ
        // ============================================================
        let stars = [];
        const STAR_COUNT = 150; // Больше звезд
        
        // Создаем маленькие звезды
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5, // ОЧЕНЬ МАЛЕНЬКИЕ (0.5-2px)
                speed: Math.random() * 1.5 + 0.5,
                brightness: Math.random() * 0.7 + 0.3
            });
        }
        
        // ============================================================
        // УМЕНЬШЕННАЯ РАКЕТА
        // ============================================================
        let rocket = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 25,
            height: 50,
            wingSize: 15,
            baseHeight: 8,
            speed: 5
        };
        
        // Астероиды
        let asteroids = [];
        const MAX_ASTEROIDS = 20;
        let asteroidSpawnTimer = 0;
        const ASTEROID_SPAWN_RATE = 30;
        
        // Отправка результата в бота
        function sendResult(time) {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'game_complete',
                    time: Math.floor(time)
                }));
            }
        }

        // Сброс игры
        function resetGame() {
            gameTime = 0;
            score = 0;
            difficultyLevel = 1;
            asteroids = [];
            rocket.x = canvas.width / 2;
            rocket.y = canvas.height - 120;
            document.getElementById('timer').textContent = '0с';
            document.getElementById('score').textContent = '💥 0';
            document.getElementById('difficulty').textContent = '🌌 УРОВЕНЬ 1';
        }

        // Начало игры
        function startGame() {
            document.getElementById('message').style.display = 'none';
            resetGame();
            gameRunning = true;
            if (!animationId) {
                gameLoop();
            }
        }

        // Конец игры
        function gameOver() {
            gameRunning = false;
            
            const message = document.getElementById('message');
            const messageText = document.getElementById('messageText');
            const startBtn = document.getElementById('startBtn');
            
            if (gameTime >= 30) {
                messageText.innerHTML = `🎉 Ты продержался ${Math.floor(gameTime)} секунд!<br><br>✅ Скидка 20% активирована!`;
                startBtn.textContent = 'ПОЛУЧИТЬ СКИДКУ';
                sendResult(gameTime);
            } else {
                messageText.innerHTML = `💥 Ты взорвался!<br>Продержался ${Math.floor(gameTime)} секунд на уровне ${difficultyLevel}.<br><br>Нужно 30 секунд для скидки.`;
                startBtn.textContent = 'ПОПРОБОВАТЬ СНОВА';
            }
            
            message.style.display = 'block';
        }

        // Создание астероида с учетом сложности
        function spawnAsteroid() {
            const baseSize = 8;
            const sizeMultiplier = 1 + (difficultyLevel * 0.2);
            const size = baseSize + Math.random() * 12 * sizeMultiplier;
            
            // Скорость зависит от сложности
            const baseSpeed = 2;
            const speedMultiplier = 1 + (difficultyLevel * 0.15);
            
            asteroids.push({
                x: Math.random() * canvas.width,
                y: -size,
                radius: size,
                speedY: baseSpeed + Math.random() * 4 * speedMultiplier,
                speedX: (Math.random() - 0.5) * 2 * (1 + difficultyLevel * 0.1)
            });
        }

        // Обновление маленьких звезд
        function updateStars() {
            for (let i = 0; i < stars.length; i++) {
                // Звезды движутся вниз (очень медленно)
                stars[i].y += stars[i].speed * (0.3 + difficultyLevel * 0.05);
                
                // Если звезда ушла за экран - появляется сверху
                if (stars[i].y > canvas.height) {
                    stars[i].y = 0;
                    stars[i].x = Math.random() * canvas.width;
                }
            }
        }

        // Отрисовка маленьких звезд
        function drawStars() {
            ctx.save();
            ctx.shadowBlur = 0;
            
            for (let i = 0; i < stars.length; i++) {
                ctx.beginPath();
                ctx.arc(stars[i].x, stars[i].y, stars[i].size, 0, Math.PI * 2);
                
                // Очень маленькие, полупрозрачные звезды
                ctx.fillStyle = `rgba(255, 255, 255, ${stars[i].brightness * 0.7})`;
                ctx.fill();
            }
            
            ctx.restore();
        }

        // Обновление игры
        function update() {
            if (!gameRunning) return;
            
            // Время
            gameTime += 1/60;
            document.getElementById('timer').textContent = Math.floor(gameTime) + 'с';
            
            // Обновляем уровень сложности (каждые 5 секунд)
            const newDifficulty = 1 + Math.floor(gameTime / 5);
            if (newDifficulty > difficultyLevel) {
                difficultyLevel = newDifficulty;
                document.getElementById('difficulty').textContent = `🌌 УРОВЕНЬ ${difficultyLevel}`;
            }
            
            // Обновляем маленькие звезды
            updateStars();
            
            // Спавн астероидов (чаще с ростом сложности)
            asteroidSpawnTimer++;
            const spawnRate = Math.max(8, ASTEROID_SPAWN_RATE - difficultyLevel * 2);
            
            if (asteroidSpawnTimer >= spawnRate && asteroids.length < MAX_ASTEROIDS) {
                spawnAsteroid();
                asteroidSpawnTimer = 0;
                
                // Иногда спавним сразу два астероида на высоких уровнях
                if (difficultyLevel > 3 && Math.random() < 0.3) {
                    spawnAsteroid();
                }
            }
            
            // Движение астероидов
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.y += a.speedY;
                a.x += a.speedX;
                
                // Проверка выхода за границы
                if (a.y - a.radius > canvas.height) {
                    asteroids.splice(i, 1);
                    score++;
                    document.getElementById('score').textContent = '💥 ' + score;
                }
                
                // Отскок от стенок (более хаотичный на высоких уровнях)
                if (a.x - a.radius < 0 || a.x + a.radius > canvas.width) {
                    a.speedX *= -0.9;
                    
                    // Иногда меняем скорость на высоких уровнях
                    if (difficultyLevel > 4 && Math.random() < 0.2) {
                        a.speedY *= 1.2;
                    }
                }
            }
            
            // Проверка столкновений
            for (let i = 0; i < asteroids.length; i++) {
                const a = asteroids[i];
                
                // Проверка расстояния до центра ракеты
                const dx = rocket.x - a.x;
                const dy = rocket.y - a.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                // Приблизительная коллизия для овальной ракеты
                const rocketRadius = Math.max(rocket.width, rocket.height) * 0.6;
                
                if (distance < rocketRadius + a.radius) {
                    gameOver();
                    break;
                }
            }
            
            // Проверка победы (30 секунд)
            if (gameTime >= 30 && gameRunning) {
                gameRunning = false;
                const message = document.getElementById('message');
                const messageText = document.getElementById('messageText');
                const startBtn = document.getElementById('startBtn');
                
                messageText.innerHTML = `🎉 ПОБЕДА!<br><br>Ты продержался 30 секунд!<br>✅ Скидка 20% активирована!`;
                startBtn.textContent = 'ПОЛУЧИТЬ СКИДКУ';
                message.style.display = 'block';
                sendResult(gameTime);
            }
        }

        // Отрисовка идеальной ракеты
        function drawRocket() {
            ctx.save();
            
            // ============================================================
            // 1. БЕЛЫЙ ОВАЛ (КОРПУС)
            // ============================================================
            ctx.beginPath();
            ctx.ellipse(rocket.x, rocket.y, rocket.width/2, rocket.height/2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 20;
            ctx.fill();
            
            // Обводка овала
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#CCCCCC';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // ============================================================
            // 2. ГОЛУБОЙ ИЛЛЮМИНАТОР
            // ============================================================
            ctx.shadowColor = '#87CEEB';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(rocket.x, rocket.y, rocket.width/3, 0, Math.PI * 2);
            ctx.fillStyle = '#87CEEB';
            ctx.fill();
            
            // Блик
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(rocket.x - 2, rocket.y - 2, rocket.width/8, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.globalAlpha = 0.7;
            ctx.fill();
            
            // ============================================================
            // 3. НИЖНЯЯ ЧАСТЬ
            // ============================================================
            ctx.globalAlpha = 1;
            ctx.shadowColor = '#CCCCCC';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#EEEEEE';
            
            ctx.beginPath();
            ctx.rect(rocket.x - rocket.width/2 - 1, rocket.y + rocket.height/2 - 2, rocket.width + 2, rocket.baseHeight);
            ctx.fill();
            
            // ============================================================
            // 4. КРАСНЫЕ КРЫЛЬЯ
            // ============================================================
            ctx.shadowColor = '#FF4444';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FF4444';
            
            // Левое крыло
            ctx.beginPath();
            ctx.moveTo(rocket.x - rocket.width/2, rocket.y + rocket.height/4);
            ctx.lineTo(rocket.x - rocket.width/2 - rocket.wingSize, rocket.y + rocket.height/2);
            ctx.lineTo(rocket.x - rocket.width/2, rocket.y + rocket.height/2);
            ctx.closePath();
            ctx.fill();
            
            // Правое крыло
            ctx.beginPath();
            ctx.moveTo(rocket.x + rocket.width/2, rocket.y + rocket.height/4);
            ctx.lineTo(rocket.x + rocket.width/2 + rocket.wingSize, rocket.y + rocket.height/2);
            ctx.lineTo(rocket.x + rocket.width/2, rocket.y + rocket.height/2);
            ctx.closePath();
            ctx.fill();
            
            // ============================================================
            // 5. ПЛАМЯ (зависит от уровня сложности)
            // ============================================================
            if (gameRunning) {
                ctx.shadowColor = '#FFAA00';
                ctx.shadowBlur = 25;
                
                // Центральное пламя
                const flameHeight = 20 + difficultyLevel * 3;
                ctx.fillStyle = '#FFAA00';
                ctx.beginPath();
                ctx.moveTo(rocket.x - 5, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.lineTo(rocket.x, rocket.y + rocket.height/2 + rocket.baseHeight + flameHeight);
                ctx.lineTo(rocket.x + 5, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.fill();
                
                // Боковое пламя
                ctx.fillStyle = '#FF8800';
                ctx.beginPath();
                ctx.moveTo(rocket.x - 8, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.lineTo(rocket.x - 3, rocket.y + rocket.height/2 + rocket.baseHeight + flameHeight * 0.7);
                ctx.lineTo(rocket.x - 2, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(rocket.x + 8, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.lineTo(rocket.x + 3, rocket.y + rocket.height/2 + rocket.baseHeight + flameHeight * 0.7);
                ctx.lineTo(rocket.x + 2, rocket.y + rocket.height/2 + rocket.baseHeight);
                ctx.fill();
                
                // Искры
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#FFD966';
                
                for (let i = 0; i < difficultyLevel; i++) {
                    const offsetX = (Math.random() - 0.5) * 15;
                    const offsetY = 15 + Math.random() * 15;
                    ctx.beginPath();
                    ctx.arc(rocket.x + offsetX, rocket.y + rocket.height/2 + rocket.baseHeight + offsetY, 1 + Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            ctx.restore();
        }

        // Отрисовка астероидов
        function drawAsteroids() {
            asteroids.forEach(a => {
                ctx.save();
                
                ctx.shadowColor = '#8B4513';
                ctx.shadowBlur = 20;
                
                ctx.beginPath();
                ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
                
                const gradient = ctx.createRadialGradient(a.x - 3, a.y - 3, 0, a.x, a.y, a.radius);
                gradient.addColorStop(0, '#8B4513');
                gradient.addColorStop(0.7, '#654321');
                gradient.addColorStop(1, '#3d2b1a');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(a.x - 3, a.y - 3, a.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#5d3a1a';
                ctx.fill();
                
                ctx.restore();
            });
        }

        // Игровой цикл
        function gameLoop() {
            if (gameRunning) {
                update();
            }
            
            // Очистка
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка маленьких звезд (фон)
            drawStars();
            
            // Отрисовка астероидов
            drawAsteroids();
            
            // Отрисовка ракеты
            drawRocket();
            
            animationId = requestAnimationFrame(gameLoop);
        }

        // Управление
        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            rocket.x = Math.max(rocket.width/2, Math.min(canvas.width - rocket.width/2, x));
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            rocket.x = Math.max(rocket.width/2, Math.min(canvas.width - rocket.width/2, x));
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
        });

        // Кнопка старта
        document.getElementById('startBtn').addEventListener('click', startGame);

        // Показываем сообщение
        document.getElementById('message').style.display = 'block';
        
        // Запускаем игру
        gameLoop();
    </script>
</body>
</html>
