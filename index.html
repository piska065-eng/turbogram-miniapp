<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboGram — Космический ускоритель</title>
    
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0f2e 0%, #1a1f3f 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            color: #ffd966;
            margin: 30px 0;
        }

        .btn {
            background: linear-gradient(135deg, #4a3f6e, #2a1f4e);
            border: 2px solid #ffd966;
            border-radius: 50px;
            padding: 20px;
            margin: 20px 0;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .online {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
        }

        .online span {
            color: #ffd966;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 TurboGram</h1>
        
        <div class="online">
            <div>Сейчас онлайн:</div>
            <span id="online">6,234</span>
        </div>

        <div class="btn" onclick="alert('Диагностика скоро будет!')">
            ⚡️ Диагностика
        </div>

        <div class="btn" onclick="buyVIP()">
            👑 VIP
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function buyVIP() {
            if (tg) {
                tg.sendData(JSON.stringify({action: 'buy_vip'}));
            } else {
                alert('VIP покупка только в Telegram');
            }
        }

        setInterval(() => {
            const online = Math.floor(Math.random() * (7000-5800) + 5800);
            document.getElementById('online').textContent = online.toLocaleString();
        }, 3000);
    </script>
</body>
</html>
