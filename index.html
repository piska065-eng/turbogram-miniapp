<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboGram — Космический ускоритель</title>
    
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0f2e 0%, #1a1f3f 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимированный фон со звездами */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Котики на ракетах (летающие) */
        .floating-cats {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cat-rocket {
            position: absolute;
            font-size: 40px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            animation: fly 20s linear infinite;
            opacity: 0.7;
        }

        .cat-rocket:nth-child(1) { top: 20%; left: -10%; animation-duration: 15s; font-size: 50px; }
        .cat-rocket:nth-child(2) { top: 50%; left: -15%; animation-duration: 18s; font-size: 45px; animation-delay: 2s; }
        .cat-rocket:nth-child(3) { top: 70%; left: -20%; animation-duration: 22s; font-size: 55px; animation-delay: 4s; }
        .cat-rocket:nth-child(4) { top: 30%; left: -25%; animation-duration: 25s; font-size: 40px; animation-delay: 1s; }
        .cat-rocket:nth-child(5) { top: 85%; left: -5%; animation-duration: 17s; font-size: 48px; animation-delay: 3s; }

        @keyframes fly {
            from { transform: translateX(0) rotate(0deg); }
            to { transform: translateX(120vw) rotate(360deg); }
        }

        /* Планеты на фоне */
        .planet {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent);
            z-index: 0;
            pointer-events: none;
        }

        .planet1 {
            width: 150px;
            height: 150px;
            top: 10%;
            right: -30px;
            background: radial-gradient(circle at 30% 30%, #4a3f6e, #2a1f3e);
            opacity: 0.3;
            animation: rotate 60s linear infinite;
        }

        .planet2 {
            width: 200px;
            height: 200px;
            bottom: 5%;
            left: -50px;
            background: radial-gradient(circle at 30% 30%, #6e4a3f, #3e2a1f);
            opacity: 0.2;
            animation: rotate 80s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Основной контент */
        .content {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка с логотипом */
        .header {
            text-align: center;
            padding: 30px 0;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #ffd966 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #b0b0ff;
            font-size: 14px;
            opacity: 0.8;
        }

        /* Карточки статистики */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 20px 15px;
            text-align: center;
            animation: cardGlow 3s ease-in-out infinite;
        }

        .stat-card:nth-child(1) { animation-delay: 0s; }
        .stat-card:nth-child(2) { animation-delay: 0.5s; }
        .stat-card:nth-child(3) { animation-delay: 1s; }
        .stat-card:nth-child(4) { animation-delay: 1.5s; }

        @keyframes cardGlow {
            0%, 100% { border-color: rgba(255, 215, 0, 0.2); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); }
            50% { border-color: rgba(255, 215, 0, 0.8); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffd966;
            margin-bottom: 5px;
            font-family: 'Inter', sans-serif;
        }

        .stat-label {
            font-size: 12px;
            color: #b0b0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Главные кнопки */
        .main-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            padding: 18px 25px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a3f6e, #2a1f4e);
            border: 1px solid #ffd966;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
        }

        .btn-vip {
            background: linear-gradient(135deg, #6e4a3f, #4e2a1f);
            border: 1px solid #ffaa00;
            box-shadow: 0 5px 15px rgba(255, 170, 0, 0.3);
            animation: pulseVIP 2s infinite;
        }

        @keyframes pulseVIP {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .btn-vip:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 170, 0, 0.5);
        }

        .btn i {
            font-size: 24px;
        }

        /* Секция диагностики */
        .diagnostic-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffd966;
            text-align: center;
        }

        .region-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .region-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .region-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            border-color: #ffd966;
        }

        .region-btn.selected {
            background: linear-gradient(135deg, #ffd966, #ffaa00);
            color: #1a1f3f;
            font-weight: 700;
            border: none;
        }

        .provider-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .provider-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 12px 10px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .provider-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        .provider-btn.selected {
            background: linear-gradient(135deg, #ffd966, #ffaa00);
            color: #1a1f3f;
            font-weight: 700;
        }

        .start-diagnostic {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 50px;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .start-diagnostic::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .start-diagnostic:hover::before {
            width: 300px;
            height: 300px;
        }

        .start-diagnostic:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.5);
        }

        /* Результаты диагностики */
        .results-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            margin: 20px 0;
            display: none;
        }

        .results-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #b0b0ff;
            font-size: 14px;
        }

        .result-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffd966;
        }

        .result-bad {
            color: #ff6b6b;
        }

        .result-good {
            color: #4CAF50;
        }

        .result-warning {
            background: rgba(255, 87, 34, 0.2);
            border-left: 4px solid #ff5722;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            color: #ffaa66;
        }

        /* Кнопки действий */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.free {
            background: linear-gradient(135deg, #4a3f6e, #2a1f4e);
            border: 1px solid #ffd966;
            color: #fff;
        }

        .action-btn.vip {
            background: linear-gradient(135deg, #6e4a3f, #4e2a1f);
            border: 1px solid #ffaa00;
            color: #fff;
            animation: pulseVIP 2s infinite;
        }

        .action-btn.back {
            background: transparent;
            border: 1px solid #b0b0ff;
            color: #b0b0ff;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* Нижнее меню */
        .bottom-menu {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #b0b0ff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .menu-item i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .menu-item.active {
            color: #ffd966;
            transform: translateY(-2px);
        }

        .menu-item:hover {
            color: #ffd966;
        }

        /* Анимация загрузки */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0f2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .rocket-loader {
            font-size: 60px;
            animation: flyLoader 2s ease-in-out infinite;
        }

        @keyframes flyLoader {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-10deg); }
            75% { transform: translateY(20px) rotate(10deg); }
        }

        .loader-text {
            margin-top: 20px;
            color: #ffd966;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Загрузочный экран -->
    <div class="loader" id="loader">
        <div>
            <div class="rocket-loader">🚀😺</div>
            <div class="loader-text">Запускаем космический ускоритель...</div>
        </div>
    </div>

    <!-- Анимированный фон со звездами -->
    <div class="stars" id="stars"></div>
    
    <!-- Летающие котики на ракетах -->
    <div class="floating-cats">
        <div class="cat-rocket">😺🚀</div>
        <div class="cat-rocket">😸🚀</div>
        <div class="cat-rocket">😹🚀</div>
        <div class="cat-rocket">😻🚀</div>
        <div class="cat-rocket">😼🚀</div>
    </div>
    
    <!-- Планеты -->
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>

    <!-- Основной контент -->
    <div class="content">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">🚀😺</div>
            <div class="title">TurboGram</div>
            <div class="subtitle">Космический ускоритель Telegram</div>
        </div>

        <!-- Карточки статистики (динамические) -->
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">342.8K</div>
                <div class="stat-label">Пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="onlineUsers">6.2K</div>
                <div class="stat-label">Сейчас онлайн</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accelerated">288K</div>
                <div class="stat-label">Ускорено</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="boost">+340%</div>
                <div class="stat-label">Прирост</div>
            </div>
        </div>

        <!-- Главные кнопки -->
        <div class="main-buttons">
            <button class="btn btn-primary" onclick="showDiagnostic()">
                <i>⚡️</i>
                Диагностика скорости
            </button>
            <button class="btn btn-vip" onclick="showVIP()">
                <i>👑</i>
                VIP Ускорение
            </button>
        </div>

        <!-- Секция диагностики (изначально скрыта) -->
        <div class="diagnostic-section" id="diagnosticSection" style="display: none;">
            <div class="section-title">🚀 Выберите параметры</div>
            
            <!-- Регионы -->
            <div id="regionsContainer" class="region-grid"></div>
            
            <!-- Навигация по регионам -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
                <button onclick="prevRegionPage()" style="background: none; border: none; color: #ffd966; font-size: 20px; cursor: pointer;">◀️</button>
                <span id="regionPageInfo">1/11</span>
                <button onclick="nextRegionPage()" style="background: none; border: none; color: #ffd966; font-size: 20px; cursor: pointer;">▶️</button>
            </div>

            <!-- Провайдеры -->
            <div class="section-title" style="margin-top: 20px;">🏢 Провайдер</div>
            <div id="providersContainer" class="provider-grid"></div>

            <!-- Кнопка запуска диагностики -->
            <button class="start-diagnostic" onclick="runDiagnostic()">
                🚀 Запустить диагностику
            </button>
        </div>

        <!-- Секция результатов диагностики -->
        <div class="results-section" id="resultsSection">
            <div class="section-title">📊 Результаты</div>
            <div id="resultsContent"></div>
        </div>

        <!-- Секция VIP информации -->
        <div class="results-section" id="vipSection">
            <div class="section-title">👑 VIP Ускорение</div>
            <div id="vipContent"></div>
        </div>

        <!-- Нижнее меню -->
        <div class="bottom-menu">
            <div class="menu-item active" onclick="showHome()">
                <i>🏠</i>
                <span>Главная</span>
            </div>
            <div class="menu-item" onclick="showDiagnostic()">
                <i>⚡️</i>
                <span>Диагностика</span>
            </div>
            <div class="menu-item" onclick="showVIP()">
                <i>👑</i>
                <span>VIP</span>
            </div>
            <div class="menu-item" onclick="closeApp()">
                <i>🔙</i>
                <span>Закрыть</span>
            </div>
        </div>
    </div>

    <script>
        // Получаем объект Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Инициализация
        tg.ready();
        tg.expand(); // Раскрываем на весь экран
        
        // Данные
        let regions = [
            "Москва", "Санкт-Петербург", "Московская обл.", "Ленинградская обл.",
            "Адыгея", "Алтай", "Амурская обл.", "Архангельская обл.",
            "Астраханская обл.", "Башкортостан", "Белгородская обл.", "Брянская обл.",
            "Бурятия", "Владимирская обл.", "Волгоградская обл.", "Вологодская обл.",
            "Воронежская обл.", "Дагестан", "ДНР", "Еврейская АО",
            "Забайкальский край", "Запорожская обл.", "Ивановская обл.", "Ингушетия",
            "Иркутская обл.", "Кабардино-Балкария", "Калининградская обл.", "Калмыкия",
            "Калужская обл.", "Камчатский край", "Карачаево-Черкесия", "Карелия",
            "Кемеровская обл.", "Кировская обл.", "Коми", "Костромская обл.",
            "Краснодарский край", "Красноярский край", "Крым", "Курганская обл.",
            "Курская обл.", "Липецкая обл.", "ЛНР", "Магаданская обл.",
            "Марий Эл", "Мордовия", "Мурманская обл.", "Ненецкий АО",
            "Нижегородская обл.", "Новгородская обл.", "Новосибирская обл.", "Омская обл.",
            "Оренбургская обл.", "Орловская обл.", "Пензенская обл.", "Пермский край",
            "Приморский край", "Псковская обл.", "Ростовская обл.", "Рязанская обл.",
            "Самарская обл.", "Саратовская обл.", "Саха (Якутия)", "Сахалинская обл.",
            "Свердловская обл.", "Севастополь", "Северная Осетия", "Смоленская обл.",
            "Ставропольский край", "Тамбовская обл.", "Татарстан", "Тверская обл.",
            "Томская обл.", "Тульская обл.", "Тыва", "Тюменская обл.",
            "Удмуртия", "Ульяновская обл.", "Хабаровский край", "Хакасия",
            "Ханты-Мансийский АО", "Челябинская обл.", "Чечня", "Чувашия",
            "Чукотский АО", "Ямало-Ненецкий АО", "Ярославская обл."
        ];
        
        let providers = [
            "Ростелеком", "МТС", "Билайн", "Мегафон", 
            "Tele2", "Yota", "Дом.ru", "Другой"
        ];
        
        let currentRegionPage = 0;
        const regionsPerPage = 8;
        let selectedRegion = null;
        let selectedProvider = null;
        
        // Создаем звезды
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // Обновление онлайн статистики
        function updateOnlineStats() {
            const onlineElement = document.getElementById('onlineUsers');
            if (onlineElement) {
                const online = Math.floor(Math.random() * (7000 - 5800 + 1)) + 5800;
                onlineElement.textContent = online.toLocaleString();
            }
        }
        
        // Загрузка регионов
        function loadRegions() {
            const container = document.getElementById('regionsContainer');
            if (!container) return;
            
            container.innerHTML = '';
            const start = currentRegionPage * regionsPerPage;
            const end = Math.min(start + regionsPerPage, regions.length);
            const currentRegions = regions.slice(start, end);
            
            currentRegions.forEach(region => {
                const btn = document.createElement('div');
                btn.className = 'region-btn' + (selectedRegion === region ? ' selected' : '');
                btn.textContent = region;
                btn.onclick = () => selectRegion(region);
                container.appendChild(btn);
            });
            
            const totalPages = Math.ceil(regions.length / regionsPerPage);
            document.getElementById('regionPageInfo').textContent = `${currentRegionPage + 1}/${totalPages}`;
        }
        
        // Загрузка провайдеров
        function loadProviders() {
            const container = document.getElementById('providersContainer');
            if (!container) return;
            
            container.innerHTML = '';
            providers.forEach(provider => {
                const btn = document.createElement('div');
                btn.className = 'provider-btn' + (selectedProvider === provider ? ' selected' : '');
                btn.textContent = provider;
                btn.onclick = () => selectProvider(provider);
                container.appendChild(btn);
            });
        }
        
        // Выбор региона
        function selectRegion(region) {
            selectedRegion = region;
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent === region) btn.classList.add('selected');
            });
        }
        
        // Выбор провайдера
        function selectProvider(provider) {
            selectedProvider = provider;
            document.querySelectorAll('.provider-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent === provider) btn.classList.add('selected');
            });
        }
        
        // Навигация по страницам регионов
        function prevRegionPage() {
            if (currentRegionPage > 0) {
                currentRegionPage--;
                loadRegions();
            }
        }
        
        function nextRegionPage() {
            const totalPages = Math.ceil(regions.length / regionsPerPage);
            if (currentRegionPage < totalPages - 1) {
                currentRegionPage++;
                loadRegions();
            }
        }

            document.getElementById('vipSection').style.display = 'none';
            
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.menu-item:nth-child(1)').classList.add('active');
        }
        
        // Показать диагностику
        function showDiagnostic() {
            document.getElementById('diagnosticSection').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('vipSection').style.display = 'none';
            
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.menu-item:nth-child(2)').classList.add('active');
            
            loadRegions();
            loadProviders();
        }
